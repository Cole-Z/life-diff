name: hosted

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: hosted
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
