# Life Diff hosted Worker.
# One origin: https://lifediff.dev
# MCP endpoint: https://lifediff.dev/mcp
# GitHub App callback: https://lifediff.dev/callback
#
# Do not put secrets in this file. Set them with `wrangler secret put`.
# See hosted/README.md before the first deploy. This repo does not deploy.

name = "life-diff"
main = "src/index.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Leave the workers.dev hostname on until the custom domain route below is
# uncommented and deployed. Then set workers_dev = false so tokens are only
# issued for https://lifediff.dev.
workers_dev = true

# Production route. Uncomment when the lifediff.dev zone is on this account
# and you are ready to attach the Worker. Do not enable this from CI.
#
# [[routes]]
# pattern = "lifediff.dev"
# custom_domain = true
#
# Path layout once that route is live (handled inside the Worker, not as
# separate route patterns):
#   https://lifediff.dev/            account, privacy, and the authorization server
#   https://lifediff.dev/callback    GitHub App user-to-server callback
#   https://lifediff.dev/mcp         remote MCP endpoint
#   https://lifediff.dev/.well-known/oauth-protected-resource/mcp
#   https://lifediff.dev/.well-known/oauth-authorization-server

[vars]
ENVIRONMENT = "production"
ISSUER = "https://lifediff.dev"
MCP_SERVER_URL = "https://lifediff.dev/mcp"
GITHUB_APP_CLIENT_ID = "replace-with-github-app-client-id"
GITHUB_APP_SLUG = "replace-with-github-app-slug"
RECEIPT_RETENTION_DAYS = "90"
SNAPSHOT_RETENTION_HOURS = "24"
ABANDONED_SESSION_DAYS = "7"
MAX_REPOS = "25"

# Placeholder ids. Create the real resources with wrangler and replace these
# before deploy. They are not live credentials.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000-0000-0000-0000-000000000000"

[[d1_databases]]
binding = "DB"
database_name = "life-diff"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "life-diff-receipts"

[[durable_objects.bindings]]
name = "USER_SESSIONS"
class_name = "UserSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSession"]

# The authorization server and the MCP resource server share this Worker so
# they can share https://lifediff.dev. Token checks run in-process. A service
# binding back to this same Worker can deadlock, so it is not configured.
# To split later, deploy the AuthServer entrypoint as its own Worker and add:
#
# [[services]]
# binding = "AUTH_SERVER"
# service = "life-diff-auth"
# entrypoint = "AuthServer"

[triggers]
crons = ["15 5 * * *"]
